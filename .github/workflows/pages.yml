name: Bygg, test og publiser

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  bygg:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Python-tester og personvernsjekk
        run: |
          python -m pip install --quiet fitdecode tzdata
          python -m unittest scripts/test_*.py
          python scripts/personvern.py
      - name: Installer
        working-directory: web
        run: npm ci
      - name: Tester
        working-directory: web
        run: npm test
      # GPS-sporene ligger ikke i repoet, så siden bygges uten kart og kurver per økt.
      - name: Bygg
        working-directory: web
        run: npm run build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist

  publiser:
    needs: bygg
    runs-on: ubuntu-26.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
