name: Bygg, test og publiser

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  bygg:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Python-lint, tester og personvernsjekk
        run: |
          python -m pip install --quiet fitdecode tzdata ruff==0.17.2
          ruff check scripts
          python -m unittest scripts/test_*.py
          python scripts/personvern.py
      - name: Installer
        working-directory: web
        run: npm ci
      - name: Lint
        working-directory: web
        run: npm run lint
      - name: Tester
        working-directory: web
        run: npm test
      # GPS-sporene ligger ikke i repoet, men i utgivelsen «spor» (scripts/publiser_spor.py).
      # Finnes den, pakkes de ut i data/garmin_spor/, og kopier-data.mjs tar dem med i bygget.
      # Uten utgivelsen bygges siden uten kart og kurver per økt.
      - name: Hent GPS-spor
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view spor --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release download spor --repo "$GITHUB_REPOSITORY" --pattern garmin_spor.zip --dir "$RUNNER_TEMP"
            python scripts/publiser_spor.py --pakk-ut "$RUNNER_TEMP/garmin_spor.zip"
          else
            echo "Ingen utgivelse «spor». Bygger uten GPS-spor."
          fi
      - name: Bygg
        working-directory: web
        run: npm run build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist

  publiser:
    needs: bygg
    runs-on: ubuntu-26.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
